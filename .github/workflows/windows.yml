name: Pacote Windows

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

jobs:
  package:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
          architecture: x64
      - name: Localizar pasta do aplicativo
        shell: pwsh
        run: |
          $appFiles = @(Get-ChildItem -Path . -Filter app.py -Recurse -File | Where-Object { $_.FullName -notmatch '[\\/]\.' })
          if ($appFiles.Count -ne 1) { throw 'Esperado exatamente um app.py no repositorio.' }
          "APP_DIR=$($appFiles[0].Directory.FullName)" >> $env:GITHUB_ENV
      - name: Instalar dependências de construção
        working-directory: ${{ env.APP_DIR }}
        run: python -m pip install -r requirements-build.txt
      - name: Verificar cálculos e interface
        working-directory: ${{ env.APP_DIR }}
        run: python -B -m unittest -q
      - name: Gerar e testar executável
        working-directory: ${{ env.APP_DIR }}
        run: python tools/build_windows.py
      - name: Disponibilizar pacote para download
        uses: actions/upload-artifact@v4
        with:
          name: MiniTaBom-Windows-x64
          path: |
            ${{ env.APP_DIR }}/dist/MiniTaBom-Windows-x64.zip
            ${{ env.APP_DIR }}/dist/MiniTaBom-Windows-x64.zip.sha256
            ${{ env.APP_DIR }}/dist/smoke-test.json
          if-no-files-found: error
